services:
  - type: cron
    name: uae-lead-scraper
    runtime: python
    pythonVersion: "3.11"
    schedule: "0 */6 * * *"  # Every 6 hours
    buildCommand: pip install -r requirements.txt
    startCommand: python scraper.py
    envVars:
      - key: SHEET_ID
        sync: false
      - key: GOOGLE_CREDENTIALS
        sync: false
      - key: PYTHONUNBUFFERED
        value: "true"
